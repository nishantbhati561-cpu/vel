name: "repo_analyzer"
model: "gemma-4-31b-it-qat-w4a16-ct"
description: "A specialized sub-agent that searches the codebase, reads files, and navigates the code graph to locate the exact source of a bug. Delegate to this agent when you need to find where to make an edit."
tools:
  - read_file
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
generate_content_config:
  max_output_tokens: 8192
  thinking_config:
    include_thoughts: true
    thinking_budget: 2048
system_instruction: !include prompts/repo_analyzer_system.md
output_key: "localization_summary"

name: "test_analyzer"
model: "gemma-4-31b-it-qat-w4a16-ct"
description: "A specialized sub-agent that runs project tests (e.g., pytest), analyzes failing assertions, and interprets stack traces. Delegate to this agent to verify if your patch works or to understand a test failure."
tools:
  - run_command
  - read_file
generate_content_config:
  max_output_tokens: 8192
  thinking_config:
    include_thoughts: true
    thinking_budget: 2048
system_instruction: !include prompts/test_analyzer_system.md
output_key: "test_diagnosis_summary"
